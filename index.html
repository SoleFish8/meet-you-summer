<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的故事 · 小说集</title>
<link rel="preload" href="./_shared/fonts/CrimsonPro-Regular.ttf" as="font" type="font/ttf" crossorigin="">
<link rel="preload" href="./_shared/fonts/InstrumentSerif-Italic.ttf" as="font" type="font/ttf" crossorigin="">
<style>
:root{
  --bg:#faf6ee;
  --ink:#3a332b;
  --muted:#8a8172;
  --rule:#e7dcc6;
  --accent:#d97a4e;
  --accent2:#7d8fb0;
  --paper:#fffdf8;
}
*{margin:0;padding:0;box-sizing:border-box;}
@font-face{
  font-family:'CrimsonPro';
  src:url('./_shared/fonts/CrimsonPro-Regular.ttf') format('truetype');
  font-weight:400;font-style:normal;
}
@font-face{
  font-family:'CrimsonPro';
  src:url('./_shared/fonts/CrimsonPro-Italic.ttf') format('truetype');
  font-weight:400;font-style:italic;
}
@font-face{
  font-family:'InstrumentSerif';
  src:url('./_shared/fonts/InstrumentSerif-Italic.ttf') format('truetype');
  font-weight:400;font-style:italic;
}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"InstrumentSerif","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  font-size:17px;
  line-height:1.9;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1200px 600px at 82% -5%, rgba(217,122,78,0.10), transparent 60%),
    radial-gradient(1000px 700px at -10% 35%, rgba(125,143,176,0.10), transparent 60%),
    radial-gradient(900px 700px at 50% 110%, rgba(243,217,196,0.35), transparent 60%);
}
.home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:4rem 1.6rem;text-align:center;}
.home-kicker{font-family:"CrimsonPro",serif;font-style:italic;letter-spacing:0.3em;font-size:0.9rem;
  color:var(--accent);margin-bottom:1.6rem;text-transform:lowercase;}
.home-title{font-size:clamp(2.4rem,7vw,4rem);font-weight:700;letter-spacing:0.16em;line-height:1.2;}
.home-sub{margin-top:1.1rem;color:var(--muted);font-size:1.05rem;letter-spacing:0.08em;}
.home-rule{width:64px;height:2px;margin:2rem auto;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6rem;max-width:860px;width:100%;margin-top:1rem;}
.card{display:block;text-decoration:none;color:inherit;background:var(--paper);
  border:1px solid var(--rule);border-radius:16px;padding:2.6rem 2.2rem;text-align:center;
  transition:transform .25s ease, box-shadow .25s ease;}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(58,51,43,0.10);}
.card .num{font-family:"CrimsonPro",serif;font-style:italic;color:var(--accent2);letter-spacing:0.2em;
  font-size:0.8rem;margin-bottom:1.2rem;}
.card .t{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;letter-spacing:0.12em;}
.card .s{margin-top:0.9rem;color:var(--muted);font-size:0.95rem;line-height:1.8;}
.card .go{margin-top:1.6rem;display:inline-block;font-size:0.85rem;letter-spacing:0.14em;color:var(--accent);
  border-bottom:1px solid var(--accent);padding-bottom:2px;}
.card.c2 .num{color:var(--accent2);}
.card.c2 .go{color:var(--accent2);border-color:var(--accent2);}
.card.c3 .num{color:#e8b45a;}
.card.c3 .go{color:#e8b45a;border-color:#e8b45a;}
.home-foot{margin-top:3.5rem;color:var(--muted);font-size:0.82rem;letter-spacing:0.2em;}
@media (max-width:600px){
  .cards{grid-template-columns:1fr;}
  .card{padding:2rem 1.6rem;}
}
</style>
</head>
<body>
<section class="home">
  <div class="home-kicker">Three Stories, One Summer</div>
  <h1 class="home-title">我们的故事</h1>
  <div class="home-sub">三个夏天，三段温柔而明亮的相遇</div>
  <div class="home-rule"></div>

  <div class="cards">
    <a class="card" href="story1.html">
      <div class="num">Story One</div>
      <div class="t">很高兴认识你</div>
      <div class="s">一个夏天，一颗橘子糖，和两个彼此温暖的少年。盛夏的午后，蝉鸣盖过整座城市。</div>
      <div class="go">开始阅读</div>
    </a>
    <a class="card c2" href="story2.html">
      <div class="num">Story Two</div>
      <div class="t">三生有幸</div>
      <div class="s">一颗玻璃弹珠，和一个自带阳光的少年。遇见一个人，是三生有幸。</div>
      <div class="go">开始阅读</div>
    </a>
    <a class="card c3" href="story3.html">
      <div class="num">Story Three</div>
      <div class="t">未说完的晚安</div>
      <div class="s">半块带着橘子香气的橡皮，和一个心脏像破风筝的少年。晚安，是一句永远说不完的约定。</div>
      <div class="go">开始阅读</div>
    </a>
  </div>

  <div class="home-foot">— 献给那些把温柔轻轻放进你手心的人 —</div>
</section>
</body>
</html>
